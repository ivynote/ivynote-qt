# Build Linux/Windows/macOS packages; on a vX.Y.Z tag also publish a GitHub Release.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag is the only input: the app version comes from it, the release notes
# are generated from the PRs merged since the previous tag, and the release is
# published only after every package built (and the tests passed).
# Tags with a suffix (v0.2.0-beta.1) become pre-releases.
#
# Pull requests touching packaging and manual runs build the packages as
# workflow artifacts without releasing anything.
#
# Optional macOS signing & notarization secrets (falls back to ad-hoc signing
# when omitted):
#   APPLE_TEAM_ID
#   MACOS_SIGN_P12_BASE64, MACOS_SIGN_P12_PASSWORD
#   APPLE_NOTARY_KEY_BASE64, APPLE_NOTARY_KEY_ID, APPLE_NOTARY_ISSUER_ID
name: Release

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "resources/**"
      - "CMakeLists.txt"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: "6.8.3"
  QTKEYCHAIN_VERSION: "0.15.0"
  FCITX5_QT_VERSION: "5.1.9"
  LIBSODIUM_VERSION: "1.0.20"
  MD4C_VERSION: "0.5.2"
  MACOS_DEPLOYMENT_TARGET: "12.0"

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      numeric: ${{ steps.v.outputs.numeric }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
            if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-suffix]"; exit 1
            fi
            release=true
          else
            base=$(sed -nE 's/^project\(ivynote-qt VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
            version="$base-dev.${GITHUB_SHA::7}"
            release=false
          fi
          numeric=${version%%-*}
          [[ $version == *-* ]] && prerelease=true || prerelease=false
          {
            echo "version=$version"
            echo "numeric=$numeric"
            echo "prerelease=$prerelease"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "version $version (release=$release, prerelease=$prerelease)"

  linux:
    needs: meta
    # Oldest supported runner: the AppImage runs on glibc >= this one's (2.35).
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      DEPS: ${{ github.workspace }}/deps
    steps:
      - uses: actions/checkout@v6

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build patchelf libsodium-dev libmd4c-dev libmd4c-html0-dev \
            libsecret-1-dev libgl1-mesa-dev libegl1 libfontconfig1 libdbus-1-3 \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb1-dev libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            extra-cmake-modules gettext appstream

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Cache built dependencies
        id: deps-cache
        uses: actions/cache@v5
        with:
          path: deps
          key: linux-deps-qt${{ env.QT_VERSION }}-keychain${{ env.QTKEYCHAIN_VERSION }}-fcitx${{ env.FCITX5_QT_VERSION }}

      - name: QtKeychain
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b "$QTKEYCHAIN_VERSION" https://github.com/frankosterfeld/qtkeychain.git /tmp/qtkeychain
          cmake -S /tmp/qtkeychain -B /tmp/qtkeychain/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_QT6=ON -DBUILD_TRANSLATIONS=OFF -DBUILD_TEST_APPLICATION=OFF \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_INSTALL_PREFIX="$DEPS" -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build /tmp/qtkeychain/build
          cmake --install /tmp/qtkeychain/build

      # Qt does not ship the fcitx5 input-method plugin, and most Chinese
      # Linux desktops use fcitx5. Built against the bundled Qt so it loads.
      # Best effort: if it fails the AppImage still has ibus; bump the cache
      # key above to retry.
      - name: fcitx5 input-method plugin
        if: steps.deps-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          git clone --depth 1 -b "$FCITX5_QT_VERSION" https://github.com/fcitx/fcitx5-qt.git /tmp/fcitx5-qt
          cmake -S /tmp/fcitx5-qt -B /tmp/fcitx5-qt/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_QT4=OFF -DENABLE_QT5=OFF -DENABLE_QT6=ON -DBUILD_ONLY_PLUGIN=ON \
            -DENABLE_QT6_WAYLAND_WORKAROUND=OFF \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build /tmp/fcitx5-qt/build
          mkdir -p "$DEPS/plugins/platforminputcontexts"
          find /tmp/fcitx5-qt/build -name 'libfcitx5platforminputcontextplugin*.so' \
            -exec cp {} "$DEPS/plugins/platforminputcontexts/" \;
          ls "$DEPS/plugins/platforminputcontexts"/*.so

      - name: Add fcitx5 plugin to Qt
        run: |
          if compgen -G "$DEPS/plugins/platforminputcontexts/*.so" > /dev/null; then
            cp "$DEPS"/plugins/platforminputcontexts/*.so "$QT_ROOT_DIR/plugins/platforminputcontexts/"
          else
            echo "::warning::fcitx5 plugin not built; the AppImage will only have ibus input-method support"
          fi

      - name: Packaging tools
        run: make appimage-tools

      - name: AppImage
        env:
          TOOLS_DIR: ${{ github.workspace }}/tools
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          LD_LIBRARY_PATH: ${{ env.DEPS }}/lib:${{ env.QT_ROOT_DIR }}/lib
          UPDATE_INFORMATION: gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|Ivynote-*-x86_64.AppImage.zsync
        run: make appimage

      # Start the packaged app on a virtual display; it saves a screenshot
      # of its window and quits, which proves it found all its libraries.
      - name: Smoke test
        run: |
          command -v xvfb-run || sudo apt-get install -y --no-install-recommends xvfb
          export APPIMAGE_EXTRACT_AND_RUN=1 IVY_SECRETS_IN_FILE=1
          export XDG_DATA_HOME=$RUNNER_TEMP/data XDG_CONFIG_HOME=$RUNNER_TEMP/config
          export IVY_SCREENSHOT=$RUNNER_TEMP/smoke/linux.png
          mkdir -p "$RUNNER_TEMP/smoke"
          timeout 120 xvfb-run -a dist/Ivynote-*.AppImage
          test -s "$IVY_SCREENSHOT"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: smoke-linux
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    needs: meta
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      NUMERIC: ${{ needs.meta.outputs.numeric }}
      DEPS: ${{ github.workspace }}\deps
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      # MSVC x64 environment for the later steps (what vcvars64.bat sets up).
      - name: MSVC environment
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { Write-Error "Visual Studio with C++ tools not found"; exit 1 }
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $before[$matches[1]] -ne $matches[2]) {
              "$($matches[1])=$($matches[2])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            }
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Cache vcpkg binaries
        uses: actions/cache@v5
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-libsodium-md4c-pkgconf-v1

      - name: libsodium, md4c (vcpkg)
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libsodium md4c pkgconf `
            --triplet x64-windows-release --x-install-root="$env:DEPS\vcpkg"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: QtKeychain
        run: |
          git clone --depth 1 -b $env:QTKEYCHAIN_VERSION https://github.com/frankosterfeld/qtkeychain.git $env:RUNNER_TEMP\qtkeychain
          cmake -S $env:RUNNER_TEMP\qtkeychain -B $env:RUNNER_TEMP\qtkeychain\build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_WITH_QT6=ON -DBUILD_TRANSLATIONS=OFF -DBUILD_TEST_APPLICATION=OFF `
            -DCMAKE_PREFIX_PATH="$($env:QT_ROOT_DIR -replace '\\', '/')" `
            -DCMAKE_INSTALL_PREFIX="$($env:DEPS -replace '\\', '/')/keychain"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build $env:RUNNER_TEMP\qtkeychain\build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install $env:RUNNER_TEMP\qtkeychain\build

      - name: Build
        run: |
          # Forward slashes: CMake treats backslashes in -D values as escapes.
          $deps = $env:DEPS -replace '\\', '/'
          $qt = $env:QT_ROOT_DIR -replace '\\', '/'
          $vcpkg = "$deps/vcpkg/x64-windows-release"
          $env:PKG_CONFIG_PATH = "$vcpkg/lib/pkgconfig"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DIVY_BUILD_TESTS=OFF `
            -DIVY_VERSION="$env:VERSION" `
            -DCMAKE_PREFIX_PATH="$deps/keychain;$qt" `
            -DPKG_CONFIG_EXECUTABLE="$vcpkg/tools/pkgconf/pkgconf.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build

      - name: Stage
        run: |
          $stage = "build\stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build\ivynote.exe $stage
          Copy-Item "$env:DEPS\keychain\bin\*.dll" $stage
          # windeployqt takes qt6keychain.dll for a Qt module (name prefix) and
          # looks for it in Qt's bin dir, so put a copy there.
          Copy-Item "$env:DEPS\keychain\bin\*.dll" "$env:QT_ROOT_DIR\bin"
          Copy-Item "$env:DEPS\vcpkg\x64-windows-release\bin\*.dll" $stage
          # Ship the MSVC runtime next to the exe so no VC++ redistributable is needed.
          Copy-Item "$env:VCToolsRedistDir\x64\Microsoft.VC143.CRT\*.dll" $stage
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw `
            --no-compiler-runtime $stage\ivynote.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Only SQLite is used; the other SQL drivers need client DLLs we don't ship.
          Get-ChildItem "$stage\sqldrivers" -Filter *.dll | Where-Object Name -ne 'qsqlite.dll' | Remove-Item
          Get-ChildItem $stage -Recurse | Select-Object -ExpandProperty FullName

      # The staged app must find all its DLLs: it saves a screenshot and quits.
      - name: Smoke test
        run: |
          $env:IVY_SECRETS_IN_FILE = "1"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\smoke" | Out-Null
          $env:IVY_SCREENSHOT = "$env:RUNNER_TEMP\smoke\windows.png"
          $p = Start-Process build\stage\ivynote.exe -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process $p; Write-Error "ivynote.exe did not quit"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "ivynote.exe exited with code $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path $env:IVY_SCREENSHOT)) { Write-Error "no screenshot"; exit 1 }

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: smoke-windows
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

      - name: Installer and portable zip
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive build\stage\* "dist\Ivynote-$env:VERSION-windows-x64-portable.zip"
          choco install innosetup -y --no-progress
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" `
            -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { Write-Error "Inno Setup not found"; exit 1 }
          # Simplified Chinese is official in newer Inno Setup; fetch it otherwise.
          $isl = Join-Path (Split-Path $iscc) "Languages\ChineseSimplified.isl"
          if (-not (Test-Path $isl)) {
            $isl = "$env:RUNNER_TEMP\ChineseSimplified.isl"
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/is-6_5_4/Files/Languages/Unofficial/ChineseSimplified.isl" -OutFile $isl
          }
          & $iscc `
            "/DAppVersion=$env:VERSION" "/DAppVersionNumeric=$env:NUMERIC" `
            "/DSourceDir=$PWD\build\stage" "/DOutputDir=$PWD\dist" "/DZhIsl=$isl" `
            packaging\windows\ivynote.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    needs: meta
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
      notarized: ${{ steps.notarize.outputs.notarized }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      NUMERIC: ${{ needs.meta.outputs.numeric }}
      DEPS: ${{ github.workspace }}/deps
    steps:
      - uses: actions/checkout@v6

      - name: Build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          for tool in ninja pkgconf; do
            command -v "$tool" >/dev/null 2>&1 || brew install "$tool" || brew install "$tool"
          done
          ninja --version
          pkg-config --version

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Cache built dependencies
        id: deps-cache
        uses: actions/cache@v5
        with:
          path: deps
          key: macos-universal-deps-qt${{ env.QT_VERSION }}-keychain${{ env.QTKEYCHAIN_VERSION }}-sodium${{ env.LIBSODIUM_VERSION }}-md4c${{ env.MD4C_VERSION }}-min${{ env.MACOS_DEPLOYMENT_TARGET }}-v1

      - name: Build universal dependencies (libsodium, md4c, QtKeychain)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET="$MACOS_DEPLOYMENT_TARGET"
          NCPU=$(sysctl -n hw.ncpu)
          mkdir -p "$DEPS/include" "$DEPS/lib/pkgconfig"

          # 1. libsodium (universal static arm64 + x86_64)
          SODIUM_TAR="$RUNNER_TEMP/libsodium-${LIBSODIUM_VERSION}.tar.gz"
          curl -fsSL --retry 3 \
            "https://github.com/jedisct1/libsodium/releases/download/${LIBSODIUM_VERSION}-RELEASE/libsodium-${LIBSODIUM_VERSION}.tar.gz" \
            -o "$SODIUM_TAR"
          for arch_pair in "arm64:aarch64-apple-darwin" "x86_64:x86_64-apple-darwin"; do
            arch=${arch_pair%%:*}
            host=${arch_pair#*:}
            src="$RUNNER_TEMP/libsodium-$arch"
            rm -rf "$src"
            mkdir -p "$src"
            tar -xzf "$SODIUM_TAR" -C "$src" --strip-components=1
            (
              cd "$src"
              ./configure --prefix="$RUNNER_TEMP/sodium-$arch" --host="$host" \
                --enable-static --disable-shared --disable-pie \
                CFLAGS="-O2 -arch $arch -mmacosx-version-min=$MACOS_DEPLOYMENT_TARGET" \
                LDFLAGS="-arch $arch -mmacosx-version-min=$MACOS_DEPLOYMENT_TARGET"
              make -j"$NCPU" install
            )
          done
          cp -R "$RUNNER_TEMP/sodium-arm64/include/"* "$DEPS/include/"
          lipo -create \
            "$RUNNER_TEMP/sodium-arm64/lib/libsodium.a" \
            "$RUNNER_TEMP/sodium-x86_64/lib/libsodium.a" \
            -output "$DEPS/lib/libsodium.a"
          sed 's|^prefix=.*|prefix=${pcfiledir}/../..|' \
            "$RUNNER_TEMP/sodium-arm64/lib/pkgconfig/libsodium.pc" \
            > "$DEPS/lib/pkgconfig/libsodium.pc"

          # 2. md4c + md4c-html (universal static)
          git clone --depth 1 -b "release-${MD4C_VERSION}" https://github.com/mity/md4c.git "$RUNNER_TEMP/md4c"
          cmake -S "$RUNNER_TEMP/md4c" -B "$RUNNER_TEMP/md4c/build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_MD2HTML_EXECUTABLE=OFF \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_DEPLOYMENT_TARGET" \
            -DCMAKE_INSTALL_PREFIX="$DEPS" -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build "$RUNNER_TEMP/md4c/build"
          cmake --install "$RUNNER_TEMP/md4c/build"

          # 3. QtKeychain (universal static)
          git clone --depth 1 -b "$QTKEYCHAIN_VERSION" https://github.com/frankosterfeld/qtkeychain.git "$RUNNER_TEMP/qtkeychain"
          cmake -S "$RUNNER_TEMP/qtkeychain" -B "$RUNNER_TEMP/qtkeychain/build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_QT6=ON -DBUILD_SHARED_LIBS=OFF -DBUILD_TRANSLATIONS=OFF -DBUILD_TEST_APPLICATION=OFF \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_DEPLOYMENT_TARGET" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_INSTALL_PREFIX="$DEPS" -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build "$RUNNER_TEMP/qtkeychain/build"
          cmake --install "$RUNNER_TEMP/qtkeychain/build"

          # Keep pkg-config prefixes relocatable across cache restores.
          for pc in "$DEPS"/lib/pkgconfig/*.pc; do
            [[ -f "$pc" ]] || continue
            sed -i '' 's|^prefix=.*|prefix=${pcfiledir}/../..|' "$pc"
          done

          for lib in "$DEPS/lib/libsodium.a" "$DEPS/lib/libmd4c.a" "$DEPS/lib/libmd4c-html.a" "$DEPS/lib/libqt6keychain.a"; do
            archs=$(lipo -archs "$lib")
            echo "$lib: $archs"
            [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]] \
              || { echo "::error::$lib is not universal ($archs)"; exit 1; }
          done

      - name: Configure signing
        id: sign
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$P12_BASE64" ]]; then
            [[ -n "$TEAM_ID" ]] || { echo "::error::APPLE_TEAM_ID must be set with MACOS_SIGN_P12_BASE64"; exit 1; }
            KC="$RUNNER_TEMP/macos-sign.keychain-db"
            KC_PASS=$(openssl rand -base64 24)
            P12_FILE="$RUNNER_TEMP/macos-cert.p12"

            echo "$P12_BASE64" | base64 --decode > "$P12_FILE"
            security create-keychain -p "$KC_PASS" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$KC_PASS" "$KC"
            security import "$P12_FILE" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC"
            if [ -f "$HOME/Library/Keychains/login.keychain-db" ]; then
              security list-keychains -d user -s "$KC" "$HOME/Library/Keychains/login.keychain-db"
            else
              security list-keychains -d user -s "$KC"
            fi
            rm -f "$P12_FILE"

            IDENTITY=$(security find-identity -v -p codesigning "$KC" \
              | sed -nE 's/.*"((Developer ID Application|Apple Distribution|Apple Development):[^"]+)".*/\1/p' \
              | head -n 1)
            [[ -n "$IDENTITY" ]] || { echo "::error::No macOS signing identity found in MACOS_SIGN_P12_BASE64"; exit 1; }

            echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
            echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing macOS build with identity: $IDENTITY"
          else
            echo "::warning::MACOS_SIGN_P12_BASE64 is not set: building ad-hoc signed macOS package"
            echo "SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, test, and package DMG
        env:
          PKG_CONFIG_PATH: ${{ env.DEPS }}/lib/pkgconfig
          MACOS_ARCHS: "arm64;x86_64"
          ARCH: universal
        run: make dmg

      - name: Notarize DMG (optional)
        id: notarize
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          DMG="dist/Ivynote-${VERSION}-macos-universal.dmg"
          if [[ "${{ steps.sign.outputs.signed }}" == "true" && -n "$NOTARY_KEY_BASE64" && -n "$NOTARY_KEY_ID" && -n "$NOTARY_ISSUER_ID" ]]; then
            KEY_FILE="$RUNNER_TEMP/notary-key.p8"
            echo "$NOTARY_KEY_BASE64" | base64 --decode > "$KEY_FILE"
            echo "NOTARY_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

            xcrun notarytool submit "$DMG" \
              --key "$KEY_FILE" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" \
              --wait
            xcrun stapler staple "$DMG"
            rm -f "$KEY_FILE"
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify macOS bundle & DMG
        run: |
          bash packaging/macos/verify-bundle.sh \
            --app build-macos/stage/Ivynote.app \
            --dmg "dist/Ivynote-${VERSION}-macos-universal.dmg" \
            --universal \
            --version "$NUMERIC" \
            --min-macos "$MACOS_DEPLOYMENT_TARGET" \
            --notarized "${{ steps.notarize.outputs.notarized }}"

      # Mount the packaged DMG and launch the app; it saves a screenshot and quits,
      # proving all frameworks, plugins, and signatures work end to end.
      - name: Smoke test
        run: |
          MOUNT_DIR="$RUNNER_TEMP/smoke-mount"
          mkdir -p "$MOUNT_DIR" "$RUNNER_TEMP/smoke"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_DIR" "dist/Ivynote-${VERSION}-macos-universal.dmg" >/dev/null
          trap 'hdiutil detach "$MOUNT_DIR" -quiet || hdiutil detach "$MOUNT_DIR" -force -quiet || true' EXIT
          export IVY_SECRETS_IN_FILE=1
          export IVY_SCREENSHOT="$RUNNER_TEMP/smoke/macos.png"
          python3 -c 'import subprocess, sys; subprocess.run(sys.argv[1:], timeout=120, check=True)' \
            "$MOUNT_DIR/Ivynote.app/Contents/MacOS/Ivynote"
          test -s "$IVY_SCREENSHOT"

      - name: Clean up signing secrets
        if: always()
        run: |
          [[ -n "${SIGN_KEYCHAIN:-}" ]] && security delete-keychain "$SIGN_KEYCHAIN" || true
          [[ -n "${NOTARY_KEY_FILE:-}" ]] && rm -f "$NOTARY_KEY_FILE" || true

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: smoke-macos
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  release:
    needs: [meta, linux, windows, macos]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      MACOS_SIGNED: ${{ needs.macos.outputs.signed }}
      MACOS_NOTARIZED: ${{ needs.macos.outputs.notarized }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: "{linux,windows,macos}"
          path: dist
          merge-multiple: true
      - name: Publish
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if [[ "$MACOS_NOTARIZED" == "true" ]]; then
            MACOS_SIGNING_NOTE="macOS 安装包已签名并通过 Apple 公证。"
          elif [[ "$MACOS_SIGNED" == "true" ]]; then
            MACOS_SIGNING_NOTE="macOS 安装包已签名但暂未公证，如系统提示无法验证开发者，请在「系统设置 → 隐私与安全性」中允许打开。"
          else
            MACOS_SIGNING_NOTE='macOS 安装包暂未签名公证，如首次打开提示“已损坏”或无法验证开发者，可运行 `xattr -cr /Applications/Ivynote.app` 后打开。'
          fi
          python3 - "$VERSION" "$MACOS_SIGNING_NOTE" ../packaging/release-notes.md ../notes.md <<'PY'
          import sys
          version, macos_note, src, dst = sys.argv[1:5]
          text = open(src, encoding="utf-8").read()
          text = text.replace("@VERSION@", version).replace("@MACOS_SIGNING_NOTE@", macos_note)
          open(dst, "w", encoding="utf-8").write(text)
          PY
          flags=()
          [[ "${{ needs.meta.outputs.prerelease }}" == true ]] && flags+=(--prerelease)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Re-run of the workflow: refresh the files, keep the notes.
            gh release upload "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --clobber
          else
            # --generate-notes appends the PRs merged since the previous tag.
            gh release create "$GITHUB_REF_NAME" * \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Ivynote $VERSION" --notes-file ../notes.md --generate-notes "${flags[@]}"
          fi
      # Tell the websites to pull this release immediately instead of waiting for
      # their next poll (within 10 minutes). Skipped when SITE_ADMIN_TOKEN is unset.
      - name: Refresh the websites
        env:
          TOKEN: ${{ secrets.SITE_ADMIN_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "SITE_ADMIN_TOKEN not set; the sites refresh on their own"; exit 0; }
          for site in https://ivynote.net https://ivynote.app; do
            curl -fsS -m 30 --retry 3 -X POST -H "Authorization: Bearer $TOKEN" "$site/api/admin/releases/refresh" \
              && echo "refreshed $site" || echo "::warning::could not refresh $site"
          done
