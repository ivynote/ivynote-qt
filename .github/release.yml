# Groups GitHub's auto-generated release notes by PR label.
# PRs without a matching label land in "其他变更".
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: ✨ 新功能
      labels: [feature, enhancement]
    - title: 🐛 修复
      labels: [bug, fix]
    - title: 📦 构建与发布
      labels: [build, ci, packaging]
    - title: 其他变更
      labels: ["*"]
